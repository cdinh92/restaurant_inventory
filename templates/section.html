{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{ section.name }} Items</h3>
    <a href="/" class="btn btn-secondary btn-sm">Back</a>
</div>

<form method="POST">
    <ul class="list-group mb-4">
        {% for item in section.items %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0">{{ item.name }}</h5>
                <small class="text-muted">From: {{ item.store.name }}</small>
            </div>
            <input type="number" name="item_{{ item.id }}" class="form-control text-center" 
                   style="width: 80px; font-size: 1.2rem;" value="{{ item.quantity_needed }}" min="0">
        </li>
        {% else %}
        <li class="list-group-item">No items assigned yet.</li>
        {% endfor %}
    </ul>
    <button type="submit" class="btn btn-success w-100 touch-btn">Save Quantities</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{ section.name }}</h3>
    <a href="/" class="btn btn-secondary btn-sm">Back</a>
</div>

<ul class="list-group shadow-sm mb-4">
    {% for item in items %}
    <li class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-md-center py-3 gap-3">
        <div>
            <h5 class="mb-0">{{ item.name }}</h5>
            <small class="text-muted">Store: {{ item.store.name }}</small>
        </div>
        
        <form method="POST" action="/update_item_qty/{{ item.id }}" class="d-flex align-items-center gap-2">
            <div class="input-group" style="width: 175px;">
                <button class="btn btn-outline-danger fw-bold px-2" type="button" onclick="adjustQty(this, -1)">-</button>
                <input type="number" name="quantity_needed" class="form-control text-center fw-bold" value="{{ item.quantity_needed }}" min="0">
                <button class="btn btn-outline-primary fw-bold px-2" type="button" onclick="adjustQty(this, 1)">+</button>
            </div>
            <button type="submit" class="btn btn-success btn-sm px-3">Save</button>
        </form>
    </li>
    {% else %}
    <li class="list-group-item text-center py-4 text-muted">No items found in this section.</li>
    {% endfor %}
</ul>

<script>
    function adjustQty(btn, change) {
        const inputGroup = btn.closest('.input-group');
        const input = inputGroup.querySelector('input[type="number"]');
        let currentValue = parseInt(input.value) || 0;
        let newValue = currentValue + change;
        if (newValue < 0) newValue = 0;
        input.value = newValue;
    }
</script>
{% endblock %}

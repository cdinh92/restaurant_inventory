{% extends "base.html" %}
{% block content %}
<style>
    /* Default sizes for mobile phones */
    .profile-avatar {
        aspect-ratio: 1/1; 
        object-fit: cover; 
        border: 3px solid #fff;
        width: 100%;
        max-width: 100px; 
    }
    .profile-name {
        font-size: 0.85rem;
    }
    
    /* When the screen is wider than 768px (tablets and desktops), scale up */
    @media (min-width: 768px) {
        .profile-avatar {
            max-width: 180px; /* Makes the images much bigger */
            border-width: 5px;
        }
        .profile-name {
            font-size: 1.25rem; /* Makes the names larger and easier to read */
        }
    }
</style>

<!-- Quick Search Bar on Home Screen -->
<form method="GET" action="/search" class="mb-4">
    <div class="input-group input-group-lg shadow-sm">
        <input type="text" name="q" class="form-control" placeholder="🔍 Quick search items...">
        <button class="btn btn-primary px-4" type="submit">Search</button>
    </div>
</form>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Inventory Sections</h3>
</div>

<!-- 3-Column Profile Grid -->
<div class="row g-3">
    {% for section in sections %}
        <div class="col-4 text-center mb-4">
            <a href="/section/{{ section.id }}" class="text-decoration-none text-dark d-block">
                {% set image_name = section.name | lower | replace(' ', '_') ~ '.jpg' %}
                <img src="{{ url_for('static', filename='images/' ~ image_name) }}" 
                     class="img-fluid rounded-circle shadow-sm mb-2 profile-avatar" 
                     alt="{{ section.name }}">
                <div class="fw-bold lh-sm text-break profile-name">{{ section.name }}</div>
            </a>
        </div>
    {% else %}
        <div class="col-12 p-4 text-center text-muted">No sections created yet. Visit Admin to set them up!</div>
    {% endfor %}
</div>
{% endblock %}

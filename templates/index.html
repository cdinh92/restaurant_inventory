{% extends "base.html" %}
{% block content %}
<style>
    .profile-avatar {
        aspect-ratio: 1/1; 
        object-fit: cover; 
        border: 3px solid #fff;
        width: 100%;
        max-width: 100px; 
    }
    .profile-name {
        font-size: 0.85rem;
    }
    
    @media (min-width: 768px) {
        .profile-avatar {
            max-width: 180px; 
            border-width: 5px;
        }
        .profile-name {
            font-size: 1.25rem; 
        }
    }
</style>

<!-- NEW: Mobile Weather Warning Pop-up (Hidden unless rain/snow is forecasted) -->
<div id="mobile-weather-alert" class="d-none">
    <div class="alert shadow-sm mb-4" style="background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-left: 5px solid #f59e0b; color: #92400e; border-radius: 8px;" role="alert">
        <div class="d-flex align-items-center gap-3">
            <span class="fs-2">⚠️</span>
            <span id="mobile-alert-text" class="fw-bold" style="font-size: 0.95rem; line-height: 1.4;"></span>
        </div>
    </div>
</div>

<!-- Quick Search Bar on Home Screen -->
<form method="GET" action="/search" class="mb-5">
    <div class="input-group input-group-lg shadow-sm">
        <input type="text" name="q" class="form-control border-0" placeholder="🔍 Quick search items...">
        <button class="btn btn-primary px-4 fw-bold border-0" style="background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);" type="submit">Search</button>
    </div>
</form>

<!-- Inventory Sections -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0 fw-bold">Inventory Sections</h3>
</div>

<!-- 3-Column Profile Grid -->
<div class="row g-3">
    {% for section in sections %}
        <div class="col-4 text-center mb-4">
            <a href="/section/{{ section.id }}" class="text-decoration-none text-dark d-block" style="transition: transform 0.2s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                {% set image_name = section.name | lower | replace(' ', '_') ~ '.jpg' %}
                <img src="{{ url_for('static', filename='images/' ~ image_name) }}" 
                     class="img-fluid rounded-circle shadow mb-2 profile-avatar" 
                     alt="{{ section.name }}">
                <div class="fw-bold lh-sm text-break profile-name">{{ section.name }}</div>
            </a>
        </div>
    {% else %}
        <div class="col-12 p-4 text-center text-muted bg-white rounded shadow-sm">No sections created yet. Visit Admin to set them up!</div>
    {% endfor %}
</div>
{% endblock %}

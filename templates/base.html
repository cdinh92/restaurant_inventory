<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Inventory</title>
    
    <!-- Custom App Icons for Mobile Home Screen -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/app_icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/app_icon.png') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .touch-btn { padding: 12px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">📦 Inventory</a>
            <div class="d-flex align-items-center gap-3">
                <!-- Search Icon Link -->
                <a class="nav-link text-white fs-4" href="/search" title="Search">🔍</a>
                <!-- Shopping Cart Icon Link -->
                <a class="nav-link text-white fs-4" href="/shopping_list" title="Shopping List">🛒</a>
                <a class="btn btn-outline-light btn-sm" href="/admin">Admin</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
